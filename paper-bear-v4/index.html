<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>圣诞撕胶带</title>
  <!-- 线上活动域名才加载用户态、监控与计费 SDK；本地预览完全离线，避免 404/错误上报。 -->
  <script>
    (function () {
      const host = location.hostname.toLowerCase();
      const isProductionActivity = /(^|\.)lofter\.com$/.test(host) || /(^|\.)163\.com$/.test(host) || /(^|\.)127\.net$/.test(host);
      if (!isProductionActivity) return;
      document.write('<script src="/spread/html/activities/activity-logic/global-data.js"><\/script>');
      document.write('<script src="https://s6.music.126.net/puzzle/puzzle@005D9C.js" async><\/script>');
      document.write('<script src="https://gz-vchar-pub.nosdn.127.net/vc-create-game/sdk/vibe-sdk-1.0.5.js"><\/script>');
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SimHei", "Heiti SC", "Microsoft YaHei", sans-serif;
      margin: 0; padding: 0;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background: linear-gradient(#b9cdf4, #eaf1ff);
    }

    #fx { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }

    /* ===== 3D 场景 ===== */
    #scene {
      position: absolute; left: 0; top: 0;
      width: 100vw; height: 100vh;
      perspective: 1100px;
      perspective-origin: 50% 42%;
      touch-action: none;
      z-index: 1;
    }
    #pivot {
      position: absolute; left: 50%; top: 56%;
      width: 0; height: 0;
      transform-style: preserve-3d;
    }
    .box3d { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
    .box3d.falling { transition: transform 0.55s cubic-bezier(0.5, 0, 0.9, 0.6); }
    .face {
      position: absolute;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-color: #c9975e;
      box-shadow: inset 0 0 0 2px rgba(122, 88, 47, 0.55);
    }
    .face.sideLR { background-color: #b3854f; }
    .face.topF { background-color: #d8a86b; }
    .box3d.dark .face { background-color: #4c4140; box-shadow: inset 0 0 0 2px rgba(28,22,22,.65); }
    .box3d.cream .face { background-color: #e5cda6; box-shadow: inset 0 0 0 2px rgba(120,84,46,.42); }
    .bearFace { position: absolute; inset: 0; pointer-events: none; }
    .bearEye { position: absolute; top: 25%; width: 12%; aspect-ratio: 1; border-radius: 50%; background: #2e2928; box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
    .bearEye.left { left: 23%; } .bearEye.right { right: 23%; }
    .bearMuzzle { position: absolute; left: 31%; top: 46%; width: 38%; height: 34%; border-radius: 46% 46% 52% 52%; background: #f2dec0; box-shadow: inset 0 0 0 2px rgba(120,84,46,.22); }
    .bearNose { position: absolute; left: 40%; top: 12%; width: 20%; height: 20%; border-radius: 50% 50% 60% 60%; background: #342b2b; }
    .bearMouth { position: absolute; left: 34%; top: 37%; width: 32%; height: 28%; border-bottom: 3px solid #6b4a3c; border-radius: 50%; }
    .face.corr {
      background-image: repeating-linear-gradient(90deg, rgba(90, 60, 30, 0.16) 0 2px, rgba(0, 0, 0, 0) 2px 13px);
    }
    .face.giftF {
      background-color: #d93848;
      background-image: linear-gradient(90deg, rgba(0, 0, 0, 0) 42%, #f2c94c 42%, #f2c94c 58%, rgba(0, 0, 0, 0) 58%);
      box-shadow: inset 0 0 0 2px rgba(120, 20, 30, 0.5);
    }
    .face.giftT {
      background-color: #e04a5a;
      background-image:
        linear-gradient(90deg, rgba(0, 0, 0, 0) 42%, #f2c94c 42%, #f2c94c 58%, rgba(0, 0, 0, 0) 58%),
        linear-gradient(0deg, rgba(0, 0, 0, 0) 42%, #f2c94c 42%, #f2c94c 58%, rgba(0, 0, 0, 0) 58%);
      box-shadow: inset 0 0 0 2px rgba(120, 20, 30, 0.5);
    }

    .tape {
      position: absolute;
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 34%, rgba(0, 0, 0, 0.14) 100%);
      transition: transform 0.38s cubic-bezier(0.4, 0.6, 0.4, 1), opacity 0.38s ease;
      border-radius: 3px;
      box-shadow: 0 2px 4px rgba(25, 18, 18, 0.28), inset 0 1px 0 rgba(255,255,255,.48);
      cursor: grab;
      will-change: transform, filter, opacity;
      touch-action: none;
    }
    .tape::after {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0 8px, rgba(255,255,255,.13) 9px 10px);
      mix-blend-mode: screen; pointer-events: none;
    }
    .tape::before {
      content: ''; position: absolute; right: -6px; top: 10%; width: 13px; height: 80%;
      border-radius: 1px 6px 6px 1px; opacity: .82;
      background: linear-gradient(90deg, rgba(255,255,255,.72), rgba(255,255,255,.08));
      box-shadow: 2px 1px 4px rgba(0,0,0,.24); transform: rotateY(-18deg);
    }
    .tape.vert::before { right: 10%; top: auto; bottom: -6px; width: 80%; height: 13px; border-radius: 1px 1px 6px 6px; transform: rotateX(18deg); }
    .tape.peeling { cursor: grabbing; filter: brightness(1.14) saturate(1.08); }
    .tape.snapback { transition: transform .22s cubic-bezier(.3,.8,.3,1), filter .2s; }
    .tape.vert {
      background-image: linear-gradient(90deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 34%, rgba(0, 0, 0, 0.14) 100%);
    }
    .tape.hiddenL { display: none; }
    .tape.pop { animation: tapepop 0.18s ease; }
    @keyframes tapepop { 0% { filter: brightness(1.6); } 100% { filter: brightness(1); } }
    .tape.glow { animation: tapeglow 0.5s ease 5 alternate; }
    @keyframes tapeglow { 0% { filter: brightness(1); } 100% { filter: brightness(2.1); } }

    /* ===== HUD ===== */
    #hud { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
    #impactFlash { position: absolute; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.72), transparent 52%); mix-blend-mode: screen; }
    #impactFlash.hit { animation: impactFlash .26s ease-out; }
    @keyframes impactFlash { 0% { opacity: .82; } 100% { opacity: 0; } }
    #combo {
      position: absolute; right: 14px; top: 190px; opacity: 0;
      color: #fff; font-size: 21px; font-weight: 900; letter-spacing: .5px;
      text-shadow: 0 2px 8px rgba(79,38,110,.65); transform: translateY(8px) scale(.8);
      transition: opacity .2s, transform .2s; text-align: right;
    }
    #combo.on { opacity: 1; transform: translateY(0) scale(1); }
    #combo small { display: block; font-size: 10px; letter-spacing: 2px; color: #ffe46d; }
    #scene.shake { animation: sceneShake .22s ease-out; }
    @keyframes sceneShake { 0%,100% { transform: translate(0,0); } 30% { transform: translate(-5px,2px); } 60% { transform: translate(4px,-2px); } }
    #topbar { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; justify-content: space-between; align-items: center; }
    .pill {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 999px; padding: 6px 14px;
      font-size: 14px; color: #35406b; font-weight: bold;
      box-shadow: 0 2px 6px rgba(60, 80, 140, 0.15);
    }
    #rollBox { display: flex; align-items: center; }
    #rollIcon {
      display: inline-block; width: 18px; height: 18px; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #ffffff 0 3px, #e8465a 4px 7px, #b7303f 8px);
      margin-right: 6px;
    }
    #rollTxt { margin-left: 8px; color: #b7303f; }
    #rollBox.pulse { animation: pulse 0.45s ease; }
    @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }

    #bins { position: absolute; left: 6px; right: 6px; top: 48px; display: flex; justify-content: center; align-items: flex-start; }
    .binSlot {
      width: 76px; height: 64px; margin: 0 5px;
      border: 4px solid #b9c1d4; background: #e7ebf4;
      clip-path: polygon(50% 0, 100% 92%, 88% 100%, 12% 100%, 0 92%);
      position: relative;
      box-shadow: 0 3px 8px rgba(60, 80, 140, 0.18);
    }
    .binSlot .pips { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; }
    .binSlot .pip { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.75); margin: 0 3px; }
    .binSlot .pip.on { background: rgba(255, 255, 255, 0.25); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.9); }
    .binSlot.locked { pointer-events: auto; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .binSlot .lockTxt { font-size: 14px; color: #8b94ab; font-weight: bold; }
    .binSlot .lockIco { font-size: 12px; color: #8b94ab; margin-top: 2px; }
    .binSlot.done { animation: binpop 0.4s ease; }
    @keyframes binpop { 0% { transform: scale(1); } 45% { transform: scale(1.18) rotate(-4deg); } 100% { transform: scale(1); } }

    #buffer { position: absolute; left: 6px; right: 6px; top: 126px; display: flex; justify-content: center; }
    .bufSlot {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: inset 0 -4px 0 rgba(120, 140, 190, 0.25);
      margin: 0 4px;
    }
    .bufSlot.filled { box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18); }
    .bufSlot.locked {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.4);
      border: 2px dashed #9aa5c0; box-shadow: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #8b94ab; font-weight: bold;
    }

    /* 任务面板：每色剩余数量 */
    #quests { position: absolute; left: 6px; right: 6px; top: 160px; display: flex; justify-content: center; }
    .qchip {
      display: flex; align-items: center;
      margin: 0 3px;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 999px; padding: 3px 9px;
      font-size: 12px; color: #35406b; font-weight: bold;
    }
    .qchip.done { opacity: 0.45; }
    .qdot { width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }

    #viewBtns { position: absolute; left: 50%; transform: translateX(-50%); bottom: 44px; display: flex; align-items: center; }
    #viewBtns button {
      pointer-events: auto;
      width: 44px; height: 44px; margin: 0 5px;
      border: none; border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: #35406b; font-size: 20px; font-weight: bold;
      box-shadow: 0 3px 8px rgba(60, 80, 140, 0.22);
    }
    #viewBtns button.mini { width: 38px; height: 38px; font-size: 16px; }
    #viewLabel { margin: 0 4px; }

    #hint {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px;
      background: rgba(255, 255, 255, 0.65);
      color: #5a6795; font-size: 12px;
      padding: 5px 14px; border-radius: 999px; white-space: nowrap;
    }

    .ov { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(20, 26, 54, 0.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .hidden { display: none; }
    .panel { width: 80%; max-width: 340px; background: #ffffff; border-radius: 18px; padding: 24px 20px; text-align: center; box-shadow: 0 10px 40px rgba(10, 20, 60, 0.35); }
    .ovTitle { font-size: 22px; color: #2c3766; font-weight: bold; }
    .ovDesc { margin-top: 10px; font-size: 14px; color: #5a6795; line-height: 1.7; }
    #costLine { margin-top: 8px; font-size: 13px; color: #b7303f; }
    .btn { margin-top: 16px; background: #e8465a; color: #ffffff; border: none; border-radius: 999px; padding: 12px 36px; font-size: 17px; font-weight: bold; box-shadow: 0 4px 12px rgba(232, 70, 90, 0.4); }
    #winStats, #loseStats { margin-top: 10px; font-size: 15px; color: #35406b; line-height: 1.8; }
    #rewardLine { margin-top: 6px; font-size: 14px; color: #2f9e5b; font-weight: bold; }

    #myToast {
      position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.72); color: #ffffff;
      padding: 8px 16px; border-radius: 8px; font-size: 14px;
      opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 50;
    }
  </style>
</head>

<body>
  <div id="scene">
    <div id="pivot"></div>
  </div>
  <canvas id="fx"></canvas>

  <div id="hud">
    <div id="impactFlash"></div>
    <div id="combo"><small>PERFECT RIP</small><span id="comboTxt">2 COMBO</span></div>
    <div id="topbar">
      <div class="pill" id="titleBox">第 1 关</div>
      <div class="pill" id="rollBox"><span id="rollIcon"></span><span id="tornTxt">0/0</span><span id="rollTxt">回收卷 0</span></div>
    </div>
    <div id="bins"></div>
    <div id="buffer"></div>
    <div id="quests"></div>
    <div id="viewBtns">
      <button id="vLeft" type="button">‹</button>
      <span class="pill" id="viewLabel">正面</span>
      <button id="vRight" type="button">›</button>
      <button id="vTop" type="button">顶</button>
      <button id="hintBtn" class="mini" type="button">💡</button>
      <button id="resetBtn" class="mini" type="button">⟲</button>
    </div>
    <div id="hint">拖动空白处旋转 · 单击胶带或按住向外撕 · 同色3条成卷</div>
  </div>

  <div id="startOv" class="ov">
    <div class="panel">
      <div class="ovTitle">🎄 圣诞撕胶带</div>
      <div class="ovDesc">拖动空白处旋转纸板模型，找到胶带翘起的端头。<br>电脑可直接单击胶带，也可按住端头向外滑动撕下。<br>同色 3 条自动成卷；拆完全部部件，揭开中心礼物！<br>胶带会逐层解锁，缓冲槽存满即失败。</div>
      <div id="levelLine"></div>
      <div id="costLine"></div>
      <button id="startBtn" class="btn" type="button">开始游戏</button>
    </div>
  </div>

  <div id="winOv" class="ov hidden">
    <div class="panel">
      <div class="ovTitle">🎁 礼物出炉！</div>
      <div id="winStats"></div>
      <div id="rewardLine"></div>
      <button id="againBtn" class="btn" type="button">下一关</button>
    </div>
  </div>

  <div id="loseOv" class="ov hidden">
    <div class="panel">
      <div class="ovTitle">💥 缓冲槽满了</div>
      <div id="loseStats"></div>
      <button id="retryBtn" class="btn" type="button">重新挑战</button>
    </div>
  </div>

  <div id="myToast"></div>

  <script type="module">
    const SDK = window.__VibeSDK || null;
    const request = SDK ? SDK.request : null;
    const platform = SDK ? SDK.platform : null;

    /* ========== 游戏配置 ========== */
    const GAME_CONFIG = {
      gameId: 'xmas_tape_tear',
      gameName: '圣诞撕胶带',
      type: 0,
      characterId: -1,
    };
    // 模式 B：按动作扣费，金额由后端 ACTION_CONSUME 决定
    const ACTIONS = { start: 'start', unlock_bin: 'unlock_bin', unlock_buffer: 'unlock_buffer', hint: 'hint' };

    /* ========== 实例 / 时间 / 存档 ========== */
    let initIdGlobal = null;
    let serverTimeOffset = 0;
    function nowTs() { return Date.now() + serverTimeOffset; }
    function syncServerTime(res) {
      const st = res && res.serverTime;
      if (typeof st === 'number' && st > 0) serverTimeOffset = st - Date.now();
    }
    const state = { plays: 0, wins: 0, totalRolls: 0, bestLevel: 1 };
    function saveData() {
      return { plays: state.plays, wins: state.wins, totalRolls: state.totalRolls, bestLevel: state.bestLevel };
    }
    let startedOnce = false;
    let curLevel = 1;
    function syncServerState(recordResult) {
      const resData = recordResult && recordResult.data;
      if (!resData) return;
      try {
        if (resData.lastId != null) initIdGlobal = resData.lastId;
        if (resData.data) {
          const parsed = typeof resData.data === 'string' ? JSON.parse(resData.data) : resData.data;
          if (typeof parsed.plays === 'number') state.plays = parsed.plays;
          if (typeof parsed.wins === 'number') state.wins = parsed.wins;
          if (typeof parsed.totalRolls === 'number') state.totalRolls = parsed.totalRolls;
          if (typeof parsed.bestLevel === 'number') state.bestLevel = parsed.bestLevel;
        }
        if (!startedOnce) {
          curLevel = Math.min(Math.max(state.bestLevel || 1, 1), LEVELS.length);
          updateStartOv();
        }
      } catch (e) { console.error('[syncServerState]', e); }
    }
    (async function fetchServerState() {
      if (!request || !GAME_CONFIG.gameId) return;
      try {
        const recordResult = await request.record({ gameId: GAME_CONFIG.gameId });
        syncServerTime(recordResult);
        if (recordResult && recordResult.data) syncServerState(recordResult);
      } catch (e) { console.error('[fetchServerState]', e); }
    })();

    async function payAction(actionKey, onOk) {
      if (!request) { onOk(); return; }
      try {
        const params = Object.assign({}, GAME_CONFIG, { action: ACTIONS[actionKey] });
        if (initIdGlobal != null) params.lastInstanceId = initIdGlobal;
        const result = await request.init(params);
        if (!result.success) {
          if (platform && platform.current === 'web') { console.warn('[payAction] web 预览免费', actionKey); onOk(); }
          return;
        }
        initIdGlobal = result.initId;
        syncServerTime(result.data);
        onOk();
        await flushReport();
      } catch (e) {
        console.error('[payAction]', actionKey, e);
        showToast('操作失败，请重试');
      }
    }
    async function flushReport() {
      if (!request || initIdGlobal == null) return;
      try {
        const res = await request.report(Object.assign({}, GAME_CONFIG, {
          initId: initIdGlobal,
          data: JSON.stringify(saveData()),
        }));
        syncServerTime(res);
      } catch (e) { console.error('[flushReport]', e); }
    }
    async function endReport(success, score, timeSec) {
      if (!request || initIdGlobal == null) return null;
      try {
        const data = Object.assign({ success: success, score: score, timeSec: timeSec, rolls: rolls, level: curLevel }, saveData());
        const res = await request.report(Object.assign({}, GAME_CONFIG, {
          initId: initIdGlobal,
          data: JSON.stringify(data),
        }));
        syncServerTime(res);
        return res;
      } catch (e) { console.error('[endReport]', e); return null; }
    }

    /* ========== toast ========== */
    const myToastEl = document.getElementById('myToast');
    let toastTimer = 0;
    function showToast(msg) {
      myToastEl.textContent = msg;
      myToastEl.style.opacity = '1';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { myToastEl.style.opacity = '0'; }, 1800);
    }

    /* ========== 颜色 ========== */
    const COL = {
      red: '#e8465a', green: '#3fbf6f', blue: '#4aa3e8',
      purple: '#b07ee8', yellow: '#f2c94c', pink: '#f28bab',
    };
    const COLOR_ORDER = ['red', 'green', 'blue', 'purple', 'yellow', 'pink'];
    function colorName(c) {
      const m = { red: '红色', green: '绿色', blue: '蓝色', purple: '紫色', yellow: '黄色', pink: '粉色' };
      return m[c] || c;
    }

    /* ========== 关卡库（难度曲线：层数/颜色/死角递增；每色数量必为3的倍数）
       face: 0前 1右 2后 3左 4顶 ========== */
    const LEVELS = [
      {
        name: '雪夜小礼盒',
        modules: [
          {
            id: 'm1', s: 1.0, tapes: [
              { face: 0, layer: 0, u: 0.5, v: 0.32, su: 0.8, sv: 0.18, color: 'red' },
              { face: 0, layer: 0, u: 0.3, v: 0.6, su: 0.18, sv: 0.5, color: 'green' },
              { face: 1, layer: 0, u: 0.5, v: 0.4, su: 0.7, sv: 0.18, color: 'blue' },
              { face: 1, layer: 0, u: 0.68, v: 0.6, su: 0.18, sv: 0.5, color: 'yellow' },
              { face: 2, layer: 0, u: 0.5, v: 0.4, su: 0.7, sv: 0.18, color: 'red' },
              { face: 2, layer: 0, u: 0.32, v: 0.6, su: 0.18, sv: 0.5, color: 'green' },
              { face: 3, layer: 0, u: 0.5, v: 0.4, su: 0.7, sv: 0.18, color: 'blue' },
              { face: 3, layer: 0, u: 0.68, v: 0.6, su: 0.18, sv: 0.5, color: 'yellow' },
            ],
          },
          {
            id: 'm3', s: 0.34, tapes: [
              { face: 0, layer: 0, u: 0.5, v: 0.5, su: 0.26, sv: 0.8, color: 'red' },
              { face: 1, layer: 0, u: 0.5, v: 0.5, su: 0.26, sv: 0.8, color: 'green' },
              { face: 2, layer: 0, u: 0.5, v: 0.5, su: 0.26, sv: 0.8, color: 'blue' },
              { face: 3, layer: 0, u: 0.5, v: 0.5, su: 0.26, sv: 0.8, color: 'yellow' },
            ],
          },
        ],
      },
      {
        name: '圣诞礼物塔',
        modules: [
          {
            id: 'm1', s: 1.0, tapes: [
              { face: 0, layer: 0, u: 0.5, v: 0.3, su: 0.8, sv: 0.16, color: 'red' },

    /* 高阶关卡生成器：每个颜色严格三条，避免随机发牌造成无解。 */
    function makePuzzleModule(id, s, colors, pose, phase) {
      const slots = [
        { face: 0, u: .5, v: .28, su: .78, sv: .14 },
        { face: 1, u: .68, v: .54, su: .16, sv: .62 },
        { face: 2, u: .5, v: .7, su: .7, sv: .14 },
      ];
      const list = [];
      colors.forEach(function (color, ci) {
        slots.forEach(function (slot, si) {
          const q = Object.assign({}, slot);
          q.face = (slot.face + ci + phase) % 5;
          q.layer = si;
          q.color = color;
          q.u = Math.max(.2, Math.min(.8, q.u + ((ci % 2) ? .06 : -.04)));
          list.push(q);
        });
      });
      return Object.assign({ id: id, s: s, tapes: list }, pose || {});
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    /* 回收框颜色队列 = 各色卷数多重集合洗牌；队首两个优先外壳就有的颜色 */
    function buildBinQueue() {
      const per = {};
      COLOR_ORDER.forEach(function (c) { per[c] = 0; });
      tapes.forEach(function (t) { per[t.color]++; });
      const q = [];
      COLOR_ORDER.forEach(function (c) {
        for (let k = 0; k < per[c] / 3; k++) q.push(c);
      });
      shuffle(q);
      const inOuter = {};
      LEVELS[curLevel - 1].modules[0].tapes.forEach(function (t) { inOuter[t.color] = 1; });
      let need = 2;
      for (let i = 0; i < q.length && need > 0; i++) {
        if (inOuter[q[i]]) {
          const target = 2 - need;
          if (i !== target) {
            const tmp = q[target];
            q[target] = q[i];
            q[i] = tmp;
          }
          need--;
        }
      }
      return q;
    }

      tornCount = 0; rolls = 0; totalTapes = tapes.length;

    function renderBuffer() {
      bufferEl.innerHTML = '';
      for (let i = 0; i < BUFFER_BASE + BUFFER_LOCKED; i++) {
        const slot = document.createElement('div');

    binsEl.addEventListener('click', function (e) {

    function findOpenBin(color) {
      for (let i = 0; i < bins.length; i++) {
        if (bins[i].state === 'open' && bins[i].color === color && bins[i].count < 3) return bins[i];
      }
      return null;
    }
    function placeColor(color) {
      const bin = findOpenBin(color);
      if (bin) {
        bin.count++;
        renderBins();
        if (bin.count >= 3) finishBin(bin);
        return true;
      }
      if (buffer.length < bufferCap) {
        buffer.push(color);
        renderBuffer();
        return true;
      }
      return false;
    }
    function finishBin(bin) {
      rolls++;
      state.totalRolls++;
      updateCounter();
      bin.state = 'done';
      bin.doneT0 = performance.now();
      rollBox.classList.remove('pulse');
      void rollBox.offsetWidth;
      rollBox.classList.add('pulse');
      beep(760, 0.18, 0.1);
    }
    function drainBuffer() {
      let guard = 0;
      while (guard++ < 24) {
        let moved = false;
        bins.forEach(function (b) {
          if (b.state === 'open' && b.color && b.count < 3) {
            const i = buffer.indexOf(b.color);
            if (i >= 0) {
              buffer.splice(i, 1);
              b.count++;
              moved = true;
              if (b.count >= 3) finishBin(b);
            }
          }
        });
        if (!moved) break;
      }
      renderBins(); renderBuffer();
    }

    /* ========== 3D 场景 DOM ========== */

    function boxDims(s, shape) {
      const base = Math.min(window.innerWidth * 0.62, window.innerHeight * 0.44, 330);
      shape = shape || {};
      return { w: base * s * (shape.sx || 1), h: base * 0.74 * s * (shape.sy || 1), d: base * 0.8 * s * (shape.sz || 1) };
    }

    function zigzagClip(horizontal) {
      const pts = [];
      const teeth = 4;
      if (horizontal) {
        for (let k = 0; k <= teeth; k++) pts.push((k % 2 ? 5 : 0) + '% ' + (k * 100 / teeth) + '%');
        for (let k = teeth; k >= 0; k--) pts.push((k % 2 ? 95 : 100) + '% ' + (k * 100 / teeth) + '%');
      } else {
        for (let k = 0; k <= teeth; k++) pts.push((k * 100 / teeth) + '% ' + (k % 2 ? 5 : 0) + '%');
        for (let k = teeth; k >= 0; k--) pts.push((k * 100 / teeth) + '% ' + (k % 2 ? 95 : 100) + '%');
      }
      return 'polygon(' + pts.join(',') + ')';
    }

    function buildSceneDOM() {
      pivotEl.innerHTML = '';

    function makeBoxFaces(boxEl, dims, kind, tapeList) {
      const w = dims.w, h = dims.h, d = dims.d;
      const faces = [
        { fw: w, fh: h, tf: 'rotateY(0deg) translateZ(' + (d / 2) + 'px)', cls: 'corr', idx: 0 },
        { fw: d, fh: h, tf: 'rotateY(90deg) translateZ(' + (w / 2) + 'px)', cls: 'sideLR corr', idx: 1 },
        { fw: w, fh: h, tf: 'rotateY(180deg) translateZ(' + (d / 2) + 'px)', cls: 'corr', idx: 2 },
        { fw: d, fh: h, tf: 'rotateY(-90deg) translateZ(' + (w / 2) + 'px)', cls: 'sideLR corr', idx: 3 },
        { fw: w, fh: d, tf: 'rotateX(90deg) translateZ(' + (h / 2) + 'px)', cls: 'topF', idx: 4 },
        { fw: w, fh: d, tf: 'rotateX(-90deg) translateZ(' + (h / 2) + 'px)', cls: '', idx: 5 },
      ];
      faces.forEach(function (f) {
        const fe = document.createElement('div');
        fe.className = 'face ' + (kind === 'gift' ? (f.idx === 4 ? 'giftT' : 'giftF') : f.cls);
        fe.style.width = f.fw + 'px';
        fe.style.height = f.fh + 'px';
        fe.style.left = (-f.fw / 2) + 'px';
        fe.style.top = (-f.fh / 2) + 'px';
        fe.style.transform = f.tf;
        boxEl.appendChild(fe);
        if (boxEl.dataset.part === 'head' && f.idx === 0) {
          const face = document.createElement('div');
          face.className = 'bearFace';

    function updateStartOv() {
      document.getElementById('levelLine').textContent =
        '当前进度：第 ' + curLevel + ' 关 / 共 ' + LEVELS.length + ' 关（' + LEVELS[curLevel - 1].name + '）';
    }
    updateStartOv();

    function doStartGame() {
      startedOnce = true;
      buildLevel();
      confetti = [];
      running = true;
      startTs = nowTs();
      state.plays++;
      startOv.classList.add('hidden');
      winOv.classList.add('hidden');
      loseOv.classList.add('hidden');
    }
    document.getElementById('startBtn').addEventListener('click', function () { payAction('start', doStartGame); });
    document.getElementById('againBtn').addEventListener('click', function () {
      if (curLevel < LEVELS.length) curLevel++;
      updateStartOv();
      payAction('start', doStartGame);
    });
    document.getElementById('retryBtn').addEventListener('click', function () { payAction('start', doStartGame); });

    /* ========== 初始化 ========== */
    buildLevel();
    running = false;
    if (PREVIEW_QUERY.get('autostart') === '1' || IS_LOCAL_FILE) doStartGame();
  </script>
</body>

</html>

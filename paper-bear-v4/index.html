  <style>

    body {

    #fx { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }

    /* ===== 3D 场景 ===== */

      perspective: 1100px;
      perspective-origin: 50% 42%;
      touch-action: none;

    }
    #pivot {
      position: absolute; left: 50%; top: 56%;

    }
    .box3d { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
    .box3d.falling { transition: transform 0.55s cubic-bezier(0.5, 0, 0.9, 0.6); }
    .face {
      position: absolute;

    .face.sideLR { background-color: #b3854f; }
    .face.topF { background-color: #d8a86b; }
    .box3d.dark .face { background-color: #4c4140; box-shadow: inset 0 0 0 2px rgba(28,22,22,.65); }
    .box3d.cream .face { background-color: #e5cda6; box-shadow: inset 0 0 0 2px rgba(120,84,46,.42); }
    .box3d.giftRed .face { background-color: #d95762; box-shadow: inset 0 0 0 2px rgba(112,24,36,.42); }
    .box3d.greenCard .face { background-color: #5ea576; box-shadow: inset 0 0 0 2px rgba(30,92,54,.4); }
    .box3d.gold .face { background-color: #efc95f; box-shadow: inset 0 0 0 2px rgba(137,97,22,.35); }
    .box3d.wheel .face { background-color: #35343a; box-shadow: inset 0 0 0 3px rgba(10,10,14,.55); }
    .box3d.carouselStripe .face { background: repeating-linear-gradient(110deg,#e15a68 0 22px,#f5dfb5 22px 44px); box-shadow: inset 0 0 0 2px rgba(123,55,55,.36); }
    .box3d.pandaWhite .face { background-color: #ede5d5; box-shadow: inset 0 0 0 2px rgba(74,67,64,.36); }
    .box3d.pandaBlack .face { background-color: #3c383a; box-shadow: inset 0 0 0 2px rgba(18,16,18,.62); }
    .bearFace { position: absolute; inset: 0; pointer-events: none; }
    .bearEye { position: absolute; top: 25%; width: 12%; aspect-ratio: 1; border-radius: 50%; background: #2e2928; box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
    .bearEye.left { left: 23%; } .bearEye.right { right: 23%; }
    .bearMuzzle { position: absolute; left: 31%; top: 46%; width: 38%; height: 34%; border-radius: 46% 46% 52% 52%; background: #f2dec0; box-shadow: inset 0 0 0 2px rgba(120,84,46,.22); }
    .bearNose { position: absolute; left: 40%; top: 12%; width: 20%; height: 20%; border-radius: 50% 50% 60% 60%; background: #342b2b; }
    .bearMouth { position: absolute; left: 34%; top: 37%; width: 32%; height: 28%; border-bottom: 3px solid #6b4a3c; border-radius: 50%; }
    .pandaFace, .carFront, .horseFace, .giftMark { position: absolute; inset: 0; pointer-events: none; }
    .pandaPatch { position: absolute; top: 22%; width: 24%; height: 30%; border-radius: 50%; background: #343034; transform: rotate(18deg); }
    .pandaPatch.left { left: 17%; } .pandaPatch.right { right: 17%; transform: rotate(-18deg); }
    .pandaPatch::after { content: ''; position: absolute; left: 36%; top: 34%; width: 30%; aspect-ratio: 1; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px #171517 inset; }
    .pandaMuzzle { position: absolute; left: 36%; top: 54%; width: 28%; height: 28%; border-radius: 48%; background: #fff8ec; }
    .pandaMuzzle::before { content: ''; position: absolute; left: 36%; top: 20%; width: 28%; height: 25%; border-radius: 50%; background: #252225; }
    .pandaMuzzle::after { content: ''; position: absolute; left: 28%; top: 42%; width: 44%; height: 30%; border-bottom: 3px solid #4f4141; border-radius: 50%; }
    .carWindshield { position: absolute; left: 16%; top: 14%; width: 68%; height: 42%; border-radius: 9px 9px 4px 4px; background: linear-gradient(145deg,#bde8f2,#6fb2c8); box-shadow: inset 0 0 0 4px #4b565f; }
    .carLight { position: absolute; bottom: 14%; width: 16%; aspect-ratio: 1.5; border-radius: 50%; background: #ffe678; box-shadow: 0 0 8px rgba(255,224,95,.8); }
    .carLight.left { left: 12%; } .carLight.right { right: 12%; }
    .horseFace::before { content: ''; position: absolute; left: 24%; top: 24%; width: 52%; height: 54%; border-radius: 48% 48% 42% 42%; background: #f5dfbd; box-shadow: inset 0 0 0 2px rgba(110,76,48,.28); }
    .horseFace::after { content: '•  •'; position: absolute; left: 0; right: 0; top: 34%; text-align: center; color: #493c37; font-size: 18px; letter-spacing: 9px; }
    .giftMark::after { content: '★'; position: absolute; left: 0; right: 0; top: 31%; text-align: center; color: rgba(255,246,193,.76); font-size: 42px; text-shadow: 0 2px 0 rgba(112,72,24,.18); }

    .face.giftT {
      background-color: #e04a5a;
      background-image:
        linear-gradient(90deg, rgba(0, 0, 0, 0) 42%, #f2c94c 42%, #f2c94c 58%, rgba(0, 0, 0, 0) 58%),

    .tape {
      position: absolute;
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.04) 38%, rgba(45, 22, 28, 0.06) 100%);
      transition: transform 0.38s cubic-bezier(0.4, 0.6, 0.4, 1), opacity 0.38s ease;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,.42);
      box-shadow: 0 2px 4px rgba(25, 18, 18, 0.28), inset 0 1px 0 rgba(255,255,255,.58), inset 0 -2px 0 rgba(70,40,38,.12);
      cursor: grab;
      will-change: transform, filter, opacity;
      touch-action: none;
    }
    .tape::after {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0 8px, rgba(255,255,255,.13) 9px 10px);
      mix-blend-mode: screen; pointer-events: none;
    }
    .tape[data-stack="3"] { box-shadow: 0 3px 4px rgba(25,18,18,.3), 0 7px 0 rgba(78,58,54,.18), 0 10px 7px rgba(25,18,18,.2), inset 0 1px 0 rgba(255,255,255,.62); }
    .tape[data-stack="2"] { box-shadow: 0 3px 4px rgba(25,18,18,.3), 0 5px 0 rgba(78,58,54,.14), 0 8px 6px rgba(25,18,18,.18), inset 0 1px 0 rgba(255,255,255,.58); }
    .tape.ripping::after { opacity: .18; }
    .tape.blockedTape { cursor: not-allowed; filter: brightness(1.02) saturate(1.12); opacity: .98; }
    .tape.blockedTape::after {
      background: repeating-linear-gradient(135deg, rgba(255,255,255,.18) 0 5px, rgba(50,40,65,.08) 5px 9px);
      mix-blend-mode: soft-light;
    }
    .tape.liveTape { outline: 1px solid rgba(255,255,255,.34); outline-offset: 1px; }
    .tape.liveTape::before { opacity: 1; box-shadow: 3px 2px 5px rgba(43,24,34,.32), inset 0 1px 0 rgba(255,255,255,.7); }
    .tape.blockedTape::before { opacity: .38; box-shadow: 1px 1px 2px rgba(0,0,0,.16); }
    .tape.wrapTape { border-radius: 5px; border-style: dashed; border-color: rgba(255,255,255,.68); }
    .tape.blockedPulse { animation: blockedPulse .34s ease; }
    @keyframes blockedPulse { 0%,100% { filter: brightness(1.02) saturate(1.12); } 45% { filter: brightness(1.14) saturate(1.02); opacity: .88; } }
    .tape::before {
      content: ''; position: absolute; right: -6px; top: 10%; width: 13px; height: 80%;
      border-radius: 1px 6px 6px 1px; opacity: .82;
      background: linear-gradient(90deg, rgba(255,255,255,.72), rgba(255,255,255,.08));
      box-shadow: 2px 1px 4px rgba(0,0,0,.24); transform: rotateY(-18deg);
    }
    .tape.vert::before { right: 10%; top: auto; bottom: -6px; width: 80%; height: 13px; border-radius: 1px 1px 6px 6px; transform: rotateX(18deg); }
    .tape.peeling { cursor: grabbing; filter: brightness(1.14) saturate(1.08); }
    .tape.snapback { transition: transform .22s cubic-bezier(.3,.8,.3,1), filter .2s; }
    .tape.vert {
      background-image: linear-gradient(90deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.04) 38%, rgba(45, 22, 28, 0.06) 100%);
    }
    .tape.hiddenL { display: none; }
    .tape.pop { animation: tapeUnlock .18s ease-out; }
    @keyframes tapeUnlock { 0% { opacity: .82; } 100% { opacity: 1; } }
    .tape.glow { animation: tapeglow 0.5s ease 5 alternate; }
    @keyframes tapeglow { 0% { filter: brightness(1); } 100% { filter: brightness(2.1); } }

    /* ===== HUD ===== */
    #hud { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
    #impactFlash { display: none; }
    #combo {
      position: absolute; right: 14px; top: 190px; opacity: 0;
      color: #fff; font-size: 21px; font-weight: 900; letter-spacing: .5px;
      text-shadow: 0 2px 8px rgba(79,38,110,.65); transform: translateY(8px) scale(.8);
      transition: opacity .2s, transform .2s; text-align: right;
    }
    #combo.on { opacity: 1; transform: translateY(0) scale(1); }
    #combo small { display: block; font-size: 10px; letter-spacing: 2px; color: #ffe46d; }
    #topbar { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; justify-content: center; align-items: center; }
    .pill {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 999px; padding: 6px 13px;
      font-size: 13px; color: #35406b; font-weight: 900;
      box-shadow: 0 2px 6px rgba(60, 80, 140, 0.15);
    }
    #titleBox { min-width: 74px; text-align: center; }
    #rollBox { position: absolute; right: 0; display: flex; align-items: center; padding: 5px 10px; }
    #rollIcon {
      display: inline-block; width: 18px; height: 18px; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #ffffff 0 3px, #e8465a 4px 7px, #b7303f 8px);
      margin-right: 6px;
    }
    #rollTxt { margin-left: 8px; color: #b7303f; }
    #rollBox.pulse { animation: pulse 0.45s ease; }
    @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }

    #storagePanel {
      position: absolute; left: 50%; top: 48px; transform: translateX(-50%);
      width: min(86vw, 340px); padding: 0; pointer-events: auto;
    }
    .storageRow { display: block; }
    .storageRow + .storageRow { margin-top: 5px; }
    .storageLabel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    #bins { width: min(100%, 304px); margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .binSlot {
      min-width: 0; height: 58px; border: 0; border-radius: 0;
      clip-path: polygon(50% 0, 100% 86%, 88% 100%, 12% 100%, 0 86%);
      position: relative; overflow: hidden; background: #e7ebf4;
      filter: drop-shadow(0 3px 3px rgba(54,66,115,.2));
    }
    .binSlot::after { content: ''; position: absolute; inset: 4px; clip-path: inherit; border: 2px solid rgba(255,255,255,.58); pointer-events: none; }
    .binSlot .binName { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .binSlot .pips { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 5px; z-index: 1; }
    .binSlot .pip { width: 13px; height: 13px; border-radius: 50%; background: rgba(255,255,255,.94); border: 2px solid rgba(55,65,105,.12); box-shadow: inset 0 2px 2px rgba(70,80,120,.12); }
    .binSlot .pip.on { background: currentColor; border-color: rgba(255,255,255,.92); box-shadow: 0 0 0 1px rgba(60,70,115,.15); }
    .binSlot.locked { pointer-events: auto; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .binSlot .lockTxt { font-size: 18px; color: #7b86a4; font-weight: 900; }
    .binSlot .lockIco { display: none; }
    .binSlot.done { animation: binpop 0.4s ease; }
    @keyframes binpop { 0% { transform: scale(1); } 45% { transform: scale(1.18) rotate(-4deg); } 100% { transform: scale(1); } }

    #buffer { width: min(100%, 226px); margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .bufSlot {
      aspect-ratio: 1; min-width: 0; max-height: 28px; border-radius: 50%;
      background: rgba(255,255,255,.88); border: 2px solid rgba(132,146,186,.34);
      box-shadow: inset 0 -4px 0 rgba(120,140,190,.16);
    }
    .bufSlot.filled { border-color: rgba(255,255,255,.82); box-shadow: inset 0 -4px 0 rgba(0,0,0,.14), 0 2px 4px rgba(60,70,120,.13); }
    .bufSlot.locked {
      pointer-events: auto;
      background: rgba(225,229,241,.62); border: 2px dashed #9aa5c0; box-shadow: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #8b94ab; font-weight: bold;
    }

    #tools { position: absolute; left: 50%; bottom: 102px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(4, 44px); gap: 12px; pointer-events: auto; }
    .toolBtn { width: 44px; height: 44px; min-width: 0; border: 0; border-radius: 50%; padding: 0; background: rgba(255,255,255,.94); color: #4d5882; box-shadow: 0 3px 8px rgba(50,65,120,.2); font-size: 0; font-weight: 900; }
    .toolBtn span { display: block; font-size: 20px; margin: 0; line-height: 44px; }
    .toolBtn small { display: none; }
    .toolBtn:disabled { opacity: .42; filter: grayscale(.7); }

    /* 任务面板：每色剩余数量 */
    #quests { position: absolute; left: 6px; right: 6px; top: 143px; display: flex; justify-content: center; }
    .qchip {
      display: flex; align-items: center;
      margin: 0 3px; background: transparent;
      border-radius: 999px; padding: 2px 4px;
      font-size: 10px; color: #53608b; font-weight: 900;
    }
    .qchip.done { opacity: 0.45; }
    .qdot { width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }

    #viewBtns { position: absolute; left: 50%; transform: translateX(-50%); bottom: 44px; display: flex; align-items: center; }
    #viewBtns button {
      pointer-events: auto;
      width: 44px; height: 44px; margin: 0 5px;
      border: none; border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: #35406b; font-size: 20px; font-weight: bold;
      box-shadow: 0 3px 8px rgba(60, 80, 140, 0.22);
    }
    #viewBtns button.mini { width: 38px; height: 38px; font-size: 16px; }
    #viewLabel { margin: 0 4px; }

    #hint {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px;
      color: #6a76a0; font-size: 11px; font-weight: 800; letter-spacing: 1px;
      white-space: nowrap;
    }

    .ov { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(20, 26, 54, 0.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .hidden { display: none; }
    .panel { width: 80%; max-width: 340px; background: #ffffff; border-radius: 18px; padding: 24px 20px; text-align: center; box-shadow: 0 10px 40px rgba(10, 20, 60, 0.35); }
    .ovTitle { font-size: 22px; color: #2c3766; font-weight: bold; }
    .ovDesc { margin-top: 10px; font-size: 14px; color: #5a6795; line-height: 1.7; }
    #costLine { display: none; }
    .btn { margin-top: 16px; background: #e8465a; color: #ffffff; border: none; border-radius: 999px; padding: 12px 36px; font-size: 17px; font-weight: bold; box-shadow: 0 4px 12px rgba(232, 70, 90, 0.4); }
    #winStats, #loseStats { margin-top: 10px; font-size: 15px; color: #35406b; line-height: 1.8; }
    #rewardLine { margin-top: 6px; font-size: 14px; color: #2f9e5b; font-weight: bold; }

    #myToast {
      position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.72); color: #ffffff;
      padding: 8px 16px; border-radius: 8px; font-size: 14px;
      opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 50;
    }
  </style>
</head>

<body>
  <div id="scene">
    <div id="pivot"></div>
  </div>
  <canvas id="fx"></canvas>

  <div id="hud">
    <div id="impactFlash"></div>
    <div id="combo"><small>PERFECT RIP</small><span id="comboTxt">2 COMBO</span></div>
    <div id="topbar">
      <div class="pill" id="titleBox">第 1 关</div>
      <div class="pill" id="rollBox"><span id="rollIcon"></span><span id="tornTxt">0/0</span><span id="rollTxt">回收卷 0</span></div>
    </div>
    <div id="storagePanel">
      <div class="storageRow"><div class="storageLabel">回收槽<span id="binStatus">2/4 已启用</span></div><div id="bins"></div></div>
      <div class="storageRow"><div class="storageLabel">缓冲槽<span id="bufferStatus">0/5</span></div><div id="buffer"></div></div>

      <button class="toolBtn" id="addBufferTool" type="button" title="增加缓冲槽" aria-label="增加缓冲槽"><span>➕</span></button>
      <button class="toolBtn" id="clearBufferTool" type="button" title="清空缓冲槽" aria-label="清空缓冲槽"><span>🧹</span></button>
      <button class="toolBtn" id="forceTearTool" type="button" title="无视层级随机撕一条" aria-label="无视层级随机撕一条"><span>✂️</span></button>
    </div>
    <div id="quests"></div>
    <div id="viewBtns">
      <button id="vLeft" type="button">‹</button>

      <button id="vRight" type="button">›</button>

      <div id="costLine"></div>
      <button id="startBtn" class="btn" type="button">开始游戏</button>
    </div>
  </div>

  <div id="winOv" class="ov hidden">
    <div class="panel">
      <div class="ovTitle">🎁 礼物出炉！</div>
      <div id="winStats"></div>

      <button id="againBtn" class="btn" type="button">下一关</button>
    </div>
  </div>

    <div id="loseOv" class="ov hidden">
      <div class="panel">
        <div class="ovTitle">💥 缓冲槽满了</div>
        <div id="loseStats"></div>
        <button id="reviveBtn" class="btn" type="button">消耗能量复活</button>
        <button id="retryBtn" class="btn" type="button">重新挑战</button>
      </div>
  </div>

  <div id="myToast"></div>

  <script type="module">
    const SDK = window.__VibeSDK || null;
    const request = SDK ? SDK.request : null;
    const platform = SDK ? SDK.platform : null;

    /* ========== 游戏配置 ========== */
    const GAME_CONFIG = {
      gameId: 'xmas_tape_tear',
      gameName: '圣诞撕胶带',
      type: 0,
      characterId: -1,
    };
    // 模式 B：按动作扣费，金额由后端 ACTION_CONSUME 决定
    const ACTIONS = {
      start: 'start', unlock_bin: 'unlock_bin', unlock_buffer: 'unlock_buffer',
      clear_buffer: 'clear_buffer', force_tear: 'force_tear', revive: 'revive', hint: 'hint'
    };

    /* ========== 实例 / 时间 / 存档 ========== */
    let initIdGlobal = null;
    let serverTimeOffset = 0;
    function nowTs() { return Date.now() + serverTimeOffset; }
    function syncServerTime(res) {
      const st = res && res.serverTime;
      if (typeof st === 'number' && st > 0) serverTimeOffset = st - Date.now();
    }
    const state = { plays: 0, wins: 0, totalRolls: 0, bestLevel: 1 };
    function saveData() {
      return { plays: state.plays, wins: state.wins, totalRolls: state.totalRolls, bestLevel: state.bestLevel };
    }
    let startedOnce = false;
    let curLevel = 1;
    function syncServerState(recordResult) {
      const resData = recordResult && recordResult.data;
      if (!resData) return;
      try {
        if (resData.lastId != null) initIdGlobal = resData.lastId;
        if (resData.data) {
          const parsed = typeof resData.data === 'string' ? JSON.parse(resData.data) : resData.data;
          if (typeof parsed.plays === 'number') state.plays = parsed.plays;
          if (typeof parsed.wins === 'number') state.wins = parsed.wins;
          if (typeof parsed.totalRolls === 'number') state.totalRolls = parsed.totalRolls;
          if (typeof parsed.bestLevel === 'number') state.bestLevel = parsed.bestLevel;
        }
        if (!startedOnce) {
          curLevel = Math.min(Math.max(state.bestLevel || 1, 1), LEVELS.length);
          updateStartOv();
        }
      } catch (e) { console.error('[syncServerState]', e); }
    }
    (async function fetchServerState() {
      if (!request || !GAME_CONFIG.gameId) return;
      try {
        const recordResult = await request.record({ gameId: GAME_CONFIG.gameId });
        syncServerTime(recordResult);
        if (recordResult && recordResult.data) syncServerState(recordResult);
      } catch (e) { console.error('[fetchServerState]', e); }
    })();

    async function payAction(actionKey, onOk) {
      if (!request) { onOk(); return; }
      try {
        const params = Object.assign({}, GAME_CONFIG, { action: ACTIONS[actionKey] });
        if (initIdGlobal != null) params.lastInstanceId = initIdGlobal;
        const result = await request.init(params);
        if (!result.success) {
          if (platform && platform.current === 'web') { console.warn('[payAction] web 预览免费', actionKey); onOk(); }
          return;
        }
        initIdGlobal = result.initId;
        syncServerTime(result.data);
        onOk();
        await flushReport();
      } catch (e) {
        console.error('[payAction]', actionKey, e);
        showToast('操作失败，请重试');
      }
    }
    async function flushReport() {
      if (!request || initIdGlobal == null) return;
      try {
        const res = await request.report(Object.assign({}, GAME_CONFIG, {
          initId: initIdGlobal,
          data: JSON.stringify(saveData()),
        }));
        syncServerTime(res);
      } catch (e) { console.error('[flushReport]', e); }
    }
    async function endReport(success, score, timeSec) {
      if (!request || initIdGlobal == null) return null;
      try {
        const data = Object.assign({ success: success, score: score, timeSec: timeSec, rolls: rolls, level: curLevel }, saveData());
        const res = await request.report(Object.assign({}, GAME_CONFIG, {
          initId: initIdGlobal,
          data: JSON.stringify(data),

    /* 高阶关卡生成器：每个颜色严格三条，避免随机发牌造成无解。 */
    function makePuzzleModule(id, s, colors, pose, phase) {
      const slots = [
        { face: 0, u: .5, v: .28, su: .78, sv: .14 },
        { face: 1, u: .68, v: .54, su: .16, sv: .62 },
        { face: 2, u: .5, v: .7, su: .7, sv: .14 },
      ];
      const list = [];
      colors.forEach(function (color, ci) {
        slots.forEach(function (slot, si) {
          const q = Object.assign({}, slot);
          q.face = (slot.face + ci + phase) % 5;
          q.layer = si;
          q.color = color;
          q.u = Math.max(.2, Math.min(.8, q.u + ((ci % 2) ? .06 : -.04)));
          list.push(q);
        });
      });
      return Object.assign({ id: id, s: s, tapes: list }, pose || {});
    }

    /*
     * 纸板熊策略胶带：每个面是一棵四层依赖树。
     * 开局每组只有最上层一条可撕；随后依次解锁 1、2、2 条，减少无脑点击。
     */
    function makeStrategicBearModule(id, s, groups, pose, phase) {
      const layout = [
        { u: .34, v: .38, su: .54, sv: .12, angle: -17, zOrder: 0 },
        { u: .66, v: .66, su: .52, sv: .12, angle: 16, zOrder: 0 },
        { u: .37, v: .52, su: .13, sv: .7, angle: 8, zOrder: 1 },
        { u: .63, v: .52, su: .13, sv: .7, angle: -9, zOrder: 1 },
        { u: .5, v: .52, su: .82, sv: .13, angle: 27, zOrder: 2, wrap: true },
        { u: .5, v: .5, su: .14, sv: .84, angle: -19, zOrder: 3, wrap: true },
      ];
      const list = [];
      groups.forEach(function (group, gi) {
        group.colors.forEach(function (color, ci) {
          const slot = layout[ci];
          const angleShift = ((phase + gi) % 3 - 1) * 3;
          list.push({
            face: group.face,
            layer: slot.zOrder,
            u: slot.u,
            v: slot.v,
            su: slot.su,
            sv: slot.sv,
            angle: slot.angle + angleShift,
            color: color,
            zOrder: slot.zOrder,
            wrap: !!slot.wrap || !!group.wrap,
            branch: id + '-' + group.face + '-' + slot.zOrder,
          });
        });
      });
      return Object.assign({ id: id, s: s, tapes: list }, pose || {});
    }

    if (previewLevel >= 1 && previewLevel <= LEVELS.length) curLevel = previewLevel;
    else if (IS_LOCAL_FILE) curLevel = 1;

    /* ========== 运行时 ========== */
    let modules = [], tapes = [];
    let tornCount = 0, totalTapes = 0, rolls = 0;
    let bins = [], buffer = [], bufferCap = 5, binQueue = [];
    const BIN_BASE = 2, BIN_MAX = 4, BUFFER_BASE = 5, BUFFER_MAX = 7;
    let reviveUsed = false;
    let running = false, wonFlag = false, loseFlag = false;
    let startTs = 0;
    let comboCount = 0, lastRipAt = 0, comboTimer = 0;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    /* 回收框颜色队列 = 各色卷数多重集合洗牌；队首两个优先外壳就有的颜色 */
    function buildBinQueue() {
      const per = {};
      COLOR_ORDER.forEach(function (c) { per[c] = 0; });
      tapes.forEach(function (t) { per[t.color]++; });
      const q = [];
      COLOR_ORDER.forEach(function (c) {
        for (let k = 0; k < per[c] / 3; k++) q.push(c);
      });
      const planned = LEVELS[curLevel - 1].binPlan;
      if (planned && planned.length === q.length) return planned.slice();
      shuffle(q);
      const inOuter = {};
      LEVELS[curLevel - 1].modules[0].tapes.forEach(function (t) { inOuter[t.color] = 1; });
      let need = 2;
      for (let i = 0; i < q.length && need > 0; i++) {
        if (inOuter[q[i]]) {
          const target = 2 - need;
          if (i !== target) {
            const tmp = q[target];
            q[target] = q[i];
            q[i] = tmp;
          }
          need--;
        }
      }
      return q;
    }

    /*
     * 新槽不再完全随机：优先承接缓冲槽，其次承接当前可撕胶带；
     * 有其它可选颜色时避开正在使用的颜色，减少同色槽重复。
     */
    function takeNextBinColor() {
      if (!binQueue.length) return null;
      const active = {};
      bins.forEach(function (b) {
        if (b.state === 'open' && b.color) active[b.color] = true;
      });
      const scored = binQueue.map(function (color, index) {
        const buffered = buffer.filter(function (c) { return c === color; }).length;
        const live = tapes.filter(function (t) { return t.color === color && t.state === 'live'; }).length;
        const remaining = tapes.filter(function (t) { return t.color === color && t.state !== 'torn'; }).length;
        return {
          index: index,
          color: color,
          active: !!active[color],
          supply: buffered + remaining,
          score: buffered * 10000 + live * 1000 + remaining * 10 - index / 1000,
        };
      });
      let candidates = scored.filter(function (x) { return x.supply > 0 && !x.active; });
      if (!candidates.length) candidates = scored.filter(function (x) { return x.supply > 0; });
      if (!candidates.length) candidates = scored.filter(function (x) { return !x.active; });
      if (!candidates.length) candidates = scored;
      candidates.sort(function (a, b) { return b.score - a.score; });
      return binQueue.splice(candidates[0].index, 1)[0] || null;
    }

    function buildLevel() {
      const LV = LEVELS[curLevel - 1];
      modules = LV.modules.map(function (m) {
        return { id: m.id, s: m.s, x: m.x || 0, y: m.y || 0, z: m.z || 0, rx: m.rx || 0, ry: m.ry || 0, rz: m.rz || 0, sx: m.sx || 1, sy: m.sy || 1, sz: m.sz || 1, tone: m.tone || '', layer: 0, falling: false, gone: false, boxEl: null, restTransform: '' };
      });
      tapes = [];
      LV.modules.forEach(function (m, mi) {
        m.tapes.forEach(function (t, ti) {
          tapes.push(Object.assign({}, t, {
            mi: mi, state: 'hidden',
            sign: (ti % 2 === 0) ? 1 : -1, el: null,
          }));
        });
      });
      modules.forEach(function (m, mi) { refreshModuleTapeStates(mi, false); });
      tornCount = 0; rolls = 0; totalTapes = tapes.length;
      wonFlag = false; loseFlag = false; reviveUsed = false;
      buffer = []; bufferCap = BUFFER_BASE;
      binQueue = buildBinQueue();
      bins = [
        { state: 'open', color: null, count: 0, doneT0: 0 },
        { state: 'open', color: null, count: 0, doneT0: 0 },
        { state: 'locked', color: null, count: 0, doneT0: 0 },
        { state: 'locked', color: null, count: 0, doneT0: 0 },
      ];
      bins[0].color = takeNextBinColor();
      bins[1].color = takeNextBinColor();
      document.getElementById('titleBox').textContent = '第 ' + curLevel + ' 关';
      renderBins(); renderBuffer(); renderQuests(); updateCounter();
      buildSceneDOM();
      setView(0, true);
    }

    /* ========== 回收框 / 缓冲 / 任务面板 ========== */
    const binsEl = document.getElementById('bins');
    const bufferEl = document.getElementById('buffer');
    const questsEl = document.getElementById('quests');
    const rollBox = document.getElementById('rollBox');

    function hexToRgba(hex, a) {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }
    function renderBins() {
      binsEl.innerHTML = '';
      bins.forEach(function (b, i) {
        const slot = document.createElement('div');
        slot.className = 'binSlot' + (b.state === 'locked' ? ' locked' : '') + (b.state === 'cycling' ? ' done' : '');
        if (b.state === 'locked') {
          slot.setAttribute('data-bin', String(i));
          const t1 = document.createElement('div');
          t1.className = 'lockTxt'; t1.textContent = '🔒';
          const t2 = document.createElement('div');
          t2.className = 'lockIco'; t2.textContent = '能量待定';
          slot.appendChild(t1); slot.appendChild(t2);
        } else {
          const c = b.color ? COL[b.color] : '#c4cbdc';
          slot.style.borderColor = c;
          slot.style.color = c;
          slot.style.background = b.color ? 'linear-gradient(145deg,' + hexToRgba(c, .78) + ',' + c + ')' : '#eef1f8';
          const name = document.createElement('div');
          name.className = 'binName';
          name.textContent = b.state === 'cycling' ? '回收中…' : (b.color ? colorName(b.color) : '已完成');
          slot.appendChild(name);
          const pips = document.createElement('div');
          pips.className = 'pips';
          for (let k = 0; k < 3; k++) {
            const p = document.createElement('span');
            p.className = 'pip' + (k < b.count ? ' on' : '');
            pips.appendChild(p);
          }
          slot.appendChild(pips);
        }
        binsEl.appendChild(slot);
      });
      const openCount = bins.filter(function (b) { return b.state !== 'locked'; }).length;
      document.getElementById('binStatus').textContent = openCount + '/' + BIN_MAX + ' 已启用';
      document.getElementById('addBinTool').disabled = openCount >= BIN_MAX;
    }
    function renderBuffer() {
      bufferEl.innerHTML = '';
      for (let i = 0; i < BUFFER_MAX; i++) {
        const slot = document.createElement('div');
        if (i >= bufferCap) {
          slot.className = 'bufSlot locked';
          slot.setAttribute('data-buf', String(i));
          slot.textContent = '＋';
        } else if (i < buffer.length) {
          slot.className = 'bufSlot filled';
          slot.style.background = COL[buffer[i]];
        } else {
          slot.className = 'bufSlot';
        }
        bufferEl.appendChild(slot);
      }
      document.getElementById('bufferStatus').textContent = buffer.length + '/' + bufferCap + ' 已占用';
      document.getElementById('addBufferTool').disabled = bufferCap >= BUFFER_MAX;
      document.getElementById('clearBufferTool').disabled = buffer.length === 0;
    }
    function renderQuests() {
      questsEl.innerHTML = '';
      const left = {};
      COLOR_ORDER.forEach(function (c) { left[c] = 0; });
      tapes.forEach(function (t) { if (t.state !== 'torn') left[t.color]++; });
      COLOR_ORDER.forEach(function (c) {
        const total = tapes.filter(function (t) { return t.color === c; }).length;
        if (!total) return;
        const chip = document.createElement('div');
        chip.className = 'qchip' + (left[c] === 0 ? ' done' : '');
        const dot = document.createElement('span');
        dot.className = 'qdot';
        dot.style.background = COL[c];
        chip.appendChild(dot);
        chip.appendChild(document.createTextNode(String(left[c])));
        questsEl.appendChild(chip);
      });
    }
    function updateCounter() {
      document.getElementById('tornTxt').textContent = tornCount + '/' + totalTapes;
      document.getElementById('rollTxt').textContent = '×' + rolls;
    }

    function findOpenBin(color) {
      for (let i = 0; i < bins.length; i++) {
        if (bins[i].state === 'open' && bins[i].color === color && bins[i].count < 3) return bins[i];
      }
      return null;
    }
    /* 方案①：同色回收槽始终归并到编号最小的槽，杜绝 1+2 被拆开。 */
    function normalizeColorBins(color) {
      const same = bins.filter(function (b) {
        return b.state === 'open' && b.color === color;
      });
      if (same.length < 2) return;
      let total = same.reduce(function (sum, b) { return sum + b.count; }, 0);
      same.forEach(function (b) { b.count = 0; });
      same.forEach(function (b) {
        if (total <= 0) return;
        b.count = Math.min(3, total);
        total -= b.count;
      });
      same.forEach(function (b) {
        if (b.count >= 3) finishBin(b);
      });
      renderBins();
    }
    function canStoreColor(color) {
      return !!findOpenBin(color) || buffer.length < bufferCap;
    }
    function hasSafeLiveTape() {
      return tapes.some(function (t) { return t.state === 'live' && !!findOpenBin(t.color); });
    }
    function checkDeadlock() {
      if (!running || wonFlag || loseFlag || buffer.length < bufferCap) return false;
      if (bins.some(function (b) { return b.state === 'cycling'; })) return false;
      if (hasSafeLiveTape()) return false;
      doLose();
      return true;
    }
    function placeColor(color) {
      normalizeColorBins(color);
      const bin = findOpenBin(color);
      if (bin) {
        bin.count++;
        renderBins();
        if (bin.count >= 3) finishBin(bin);
        return true;
      }
      if (buffer.length < bufferCap) {
        buffer.push(color);
        renderBuffer();
        return true;
      }
      return false;
    }
    function finishBin(bin) {
      if (!bin || bin.state !== 'open') return;
      rolls++;
      state.totalRolls++;
      updateCounter();
      bin.state = 'cycling';
      bin.doneT0 = performance.now();
      renderBins();
      rollBox.classList.remove('pulse');
      void rollBox.offsetWidth;
      rollBox.classList.add('pulse');
      beep(760, 0.18, 0.1);
      setTimeout(function () {
        if (wonFlag) return;
        bin.state = 'open';
        bin.color = takeNextBinColor();
        bin.count = 0;
        if (bin.color) normalizeColorBins(bin.color);
        renderBins();
        drainBuffer();
        if (bin.color) showToast('回收完成，新槽：' + colorName(bin.color));
        checkDeadlock();
      }, 420);
    }
    function drainBuffer() {
      let guard = 0;
      while (guard++ < 64) {
        let moved = false;
        for (let i = 0; i < buffer.length; i++) {
          normalizeColorBins(buffer[i]);
          const b = findOpenBin(buffer[i]);
          if (b) {
            buffer.splice(i, 1);
            b.count++;
            moved = true;
            if (b.count >= 3) finishBin(b);
            break;
          }
        }
        if (!moved) break;
      }
      renderBins(); renderBuffer();
    }

    function unlockBinAt(idx, announce) {
      const b = bins[idx];
      if (!b || b.state !== 'locked') return false;
      b.state = 'open';
      b.color = takeNextBinColor();
      b.count = 0;
      if (b.color) normalizeColorBins(b.color);
      renderBins();
      drainBuffer();
      if (announce !== false) showToast(b.color ? '新增回收槽：' + colorName(b.color) : '新增回收槽');
      return true;
    }
    function unlockNextBin(announce) {
      const idx = bins.findIndex(function (b) { return b.state === 'locked'; });
      return idx >= 0 ? unlockBinAt(idx, announce) : false;
    }
    function addBufferSlot() {
      if (bufferCap >= BUFFER_MAX) return false;
      bufferCap++;
      renderBuffer();
      showToast('缓冲槽扩充为 ' + bufferCap + ' 格（本局）');
      return true;
    }

    binsEl.addEventListener('click', function (e) {
      const slot = e.target.closest ? e.target.closest('.binSlot.locked') : null;
      if (!slot || dragMoved) return;
      const idx = parseInt(slot.getAttribute('data-bin'), 10);
      payAction('unlock_bin', function () { unlockBinAt(idx, true); });
    });
    bufferEl.addEventListener('click', function (e) {
      const slot = e.target.closest ? e.target.closest('.bufSlot.locked') : null;
      if (!slot || dragMoved) return;
      payAction('unlock_buffer', addBufferSlot);
    });
    document.getElementById('addBinTool').addEventListener('click', function () {
      if (!running || dragMoved) return;
      payAction('unlock_bin', function () { if (!unlockNextBin(true)) showToast('回收槽已达上限'); });
    });
    document.getElementById('addBufferTool').addEventListener('click', function () {
      if (!running || dragMoved) return;
      payAction('unlock_buffer', function () { if (!addBufferSlot()) showToast('缓冲槽已达上限'); });
    });
    document.getElementById('clearBufferTool').addEventListener('click', function () {
      if (!running || dragMoved || buffer.length === 0) return;
      payAction('clear_buffer', function () {
        buffer = [];
        renderBuffer();
        showToast('缓冲槽已清空');
      });
    });
    document.getElementById('forceTearTool').addEventListener('click', function () {
      if (!running || dragMoved) return;
      payAction('force_tear', function () {
        const candidates = tapes.filter(function (t) {
          return (t.state === 'live' || t.state === 'blocked' || t.state === 'hidden') && canStoreColor(t.color);
        });
        if (!candidates.length) { checkDeadlock(); showToast('当前没有可安全收纳的胶带'); return; }
        const t = candidates[Math.floor(Math.random() * candidates.length)];
        if (t.state === 'hidden' || t.state === 'blocked') {
          t.state = 'live';
          if (t.el) { t.el.classList.remove('hiddenL', 'blockedTape'); t.el.classList.add('pop'); }
        }
        showToast('剪刀道具：无视层级撕除一条');
        onTapeClick(t, true);
      });
    });

    /* ========== 3D 场景 DOM ========== */
    const sceneEl = document.getElementById('scene');
    const pivotEl = document.getElementById('pivot');

    function boxDims(s, shape) {
      const base = Math.min(window.innerWidth * 0.62, window.innerHeight * 0.44, 330);
      shape = shape || {};
      return { w: base * s * (shape.sx || 1), h: base * 0.74 * s * (shape.sy || 1), d: base * 0.8 * s * (shape.sz || 1) };
    }

    function zigzagClip(horizontal) {
      const pts = [];
      const teeth = 4;
      if (horizontal) {
        for (let k = 0; k <= teeth; k++) pts.push((k % 2 ? 5 : 0) + '% ' + (k * 100 / teeth) + '%');
        for (let k = teeth; k >= 0; k--) pts.push((k % 2 ? 95 : 100) + '% ' + (k * 100 / teeth) + '%');
      } else {
        for (let k = 0; k <= teeth; k++) pts.push((k * 100 / teeth) + '% ' + (k % 2 ? 5 : 0) + '%');
        for (let k = teeth; k >= 0; k--) pts.push((k * 100 / teeth) + '% ' + (k % 2 ? 95 : 100) + '%');
      }
      return 'polygon(' + pts.join(',') + ')';
    }

    function tapeDepth(t) {
      return 7 + (typeof t.zOrder === 'number' ? t.zOrder * .7 : 0);
    }
    function tapeAngleTransform(t) { return ' rotateZ(' + (t.angle || 0) + 'deg)'; }

    function buildSceneDOM() {
      pivotEl.innerHTML = '';
      const gift = document.createElement('div');
      gift.className = 'box3d';
      gift.id = 'giftBox';
      makeBoxFaces(gift, boxDims(0.3), 'gift', []);
      gift.style.display = 'none';
      pivotEl.appendChild(gift);

      for (let mi = modules.length - 1; mi >= 0; mi--) {
        const m = modules[mi];
        const box = document.createElement('div');
        box.className = 'box3d ' + m.tone + ' part-' + m.id;
        box.dataset.part = m.id;
        m.boxEl = box;
        m.restTransform = 'translate3d(' + m.x + 'px,' + m.y + 'px,' + m.z + 'px) rotateX(' + m.rx + 'deg) rotateY(' + m.ry + 'deg) rotateZ(' + m.rz + 'deg)';
        box.style.transform = m.restTransform;
        const myTapes = tapes.filter(function (t) { return t.mi === mi; });
        makeBoxFaces(box, boxDims(m.s, m), 'card', myTapes);
        pivotEl.appendChild(box);
      }
    }

    function makeBoxFaces(boxEl, dims, kind, tapeList) {
      const w = dims.w, h = dims.h, d = dims.d;
      const faces = [
        { fw: w, fh: h, tf: 'rotateY(0deg) translateZ(' + (d / 2) + 'px)', cls: 'corr', idx: 0 },
        { fw: d, fh: h, tf: 'rotateY(90deg) translateZ(' + (w / 2) + 'px)', cls: 'sideLR corr', idx: 1 },
        { fw: w, fh: h, tf: 'rotateY(180deg) translateZ(' + (d / 2) + 'px)', cls: 'corr', idx: 2 },
        { fw: d, fh: h, tf: 'rotateY(-90deg) translateZ(' + (w / 2) + 'px)', cls: 'sideLR corr', idx: 3 },
        { fw: w, fh: d, tf: 'rotateX(90deg) translateZ(' + (h / 2) + 'px)', cls: 'topF', idx: 4 },
        { fw: w, fh: d, tf: 'rotateX(-90deg) translateZ(' + (h / 2) + 'px)', cls: '', idx: 5 },
      ];
      faces.forEach(function (f) {
        const fe = document.createElement('div');
        fe.className = 'face ' + (kind === 'gift' ? (f.idx === 4 ? 'giftT' : 'giftF') : f.cls);
        fe.style.width = f.fw + 'px';
        fe.style.height = f.fh + 'px';
        fe.style.left = (-f.fw / 2) + 'px';
        fe.style.top = (-f.fh / 2) + 'px';
        fe.style.transform = f.tf;
        boxEl.appendChild(fe);
        if (boxEl.dataset.part === 'head' && f.idx === 0) {
          const face = document.createElement('div');
          face.className = 'bearFace';
          face.innerHTML = '<span class="bearEye left"></span><span class="bearEye right"></span><span class="bearMuzzle"><i class="bearNose"></i><i class="bearMouth"></i></span>';
          fe.appendChild(face);
        }
        if (boxEl.dataset.part === 'pandaHead' && f.idx === 0) {
          const face = document.createElement('div');
          face.className = 'pandaFace';
          face.innerHTML = '<span class="pandaPatch left"></span><span class="pandaPatch right"></span><span class="pandaMuzzle"></span>';
          fe.appendChild(face);
        }
        if (boxEl.dataset.part === 'carCabin' && f.idx === 0) {
          const face = document.createElement('div');
          face.className = 'carFront';
          face.innerHTML = '<span class="carWindshield"></span><span class="carLight left"></span><span class="carLight right"></span>';
          fe.appendChild(face);
        }
        if ((boxEl.dataset.part === 'carouselHorseL' || boxEl.dataset.part === 'carouselHorseR') && f.idx === 0) {
          const face = document.createElement('div');
          face.className = 'horseFace';
          fe.appendChild(face);
        }
        if (boxEl.dataset.part === 'giftCore' && f.idx === 0) {
          const face = document.createElement('div');
          face.className = 'giftMark';
          fe.appendChild(face);
        }
        if (kind !== 'gift' && f.idx <= 4) {
          tapeList.forEach(function (t) {
            if (t.face !== f.idx) return;
            const te = document.createElement('div');
            const horiz = t.su >= t.sv;
            te.className = 'tape' + (horiz ? '' : ' vert') + (t.state === 'hidden' ? ' hiddenL' : '') + (t.state === 'blocked' ? ' blockedTape' : '') + (t.state === 'live' ? ' liveTape' : '') + (t.wrap ? ' wrapTape' : '');
            te.dataset.stack = t.state === 'blocked' ? '2' : '1';
            te.dataset.layer = String((t.zOrder || 0) + 1);
            te.style.left = ((t.u - t.su / 2) * 100) + '%';
            te.style.top = ((t.v - t.sv / 2) * 100) + '%';
            te.style.width = (t.su * 100) + '%';
            te.style.height = (t.sv * 100) + '%';
            te.style.backgroundColor = COL[t.color];
            te.style.clipPath = zigzagClip(horiz);
            te.style.webkitClipPath = zigzagClip(horiz);
            te.style.transform = 'translateZ(' + tapeDepth(t) + 'px)' + tapeAngleTransform(t);
            te.addEventListener('pointerdown', function (e) { startTapePeel(e, t, te); });
            te.addEventListener('click', function (e) {
              if ((t.suppressClickUntil || 0) > performance.now()) return;
              e.preventDefault(); e.stopPropagation();
              onTapeClick(t, false);
            });
            t.el = te;
            fe.appendChild(te);
          });
        }
      });
    }

    /* ========== 视角：预设动画 + 阻尼拖拽 ========== */
    const PRESETS = [
      { yaw: -22, pitch: -14, label: '正面' },
      { yaw: -112, pitch: -14, label: '右面' },
      { yaw: -202, pitch: -14, label: '背面' },
      { yaw: -292, pitch: -14, label: '左面' },
      { yaw: -22, pitch: -74, label: '顶面' },
    ];
    let yaw = -22, pitch = -14, presetIdx = 0;
    let velYaw = 0, inertiaOn = false;
    let spinT0 = 0, spinBaseYaw = 0;

    function applyPivot(animated) {
      pivotEl.style.transition = animated ? 'transform 0.55s cubic-bezier(0.3, 0.7, 0.25, 1)' : 'none';
      pivotEl.style.transform = 'rotateX(' + pitch + 'deg) rotateY(' + yaw + 'deg)';
    }
    function setView(idx, instant) {
      presetIdx = idx;
      yaw = PRESETS[idx].yaw;
      pitch = PRESETS[idx].pitch;
      inertiaOn = false; velYaw = 0; spinT0 = 0;
      document.getElementById('viewLabel').textContent = PRESETS[idx].label;
      applyPivot(!instant);
    }
    document.getElementById('vLeft').addEventListener('click', function () {
      if (dragMoved) return;
      setView(((presetIdx % 4) + 3) % 4, false);
    });
    document.getElementById('vRight').addEventListener('click', function () {
      if (dragMoved) return;
      setView(((presetIdx % 4) + 1) % 4, false);
    });
    document.getElementById('vTop').addEventListener('click', function () {
      if (dragMoved) return;
      if (presetIdx === 4) setView(0, false); else setView(4, false);
    });
    document.getElementById('resetBtn').addEventListener('click', function () {
      if (dragMoved) return;
      setView(0, false);
      showToast('视角已重置');
    });

    let dragMoved = false, downX = 0, downY = 0, dragging = false;
    sceneEl.addEventListener('pointerdown', function (e) {
      dragging = true; dragMoved = false;
      downX = e.clientX; downY = e.clientY;
      inertiaOn = false; spinT0 = 0;
    });
    sceneEl.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      const dx = e.clientX - downX, dy = e.clientY - downY;
      if (!dragMoved && Math.abs(dx) + Math.abs(dy) > 8) {
        dragMoved = true;
        applyPivot(false);
      }
      if (dragMoved) {
        yaw += dx * 0.35;

    function endDrag() {
      if (dragging && dragMoved && Math.abs(velYaw) > 0.05) inertiaOn = true;

      setTimeout(function () { dragMoved = false; }, 60);
    }
    sceneEl.addEventListener('pointerup', endDrag);
    sceneEl.addEventListener('pointercancel', endDrag);

    /* ========== 提示（消耗能量高亮可撕胶带） ========== */
    let hintCool = 0;
    document.getElementById('hintBtn').addEventListener('click', function () {
      if (dragMoved || !running) return;
      const now = performance.now();
      if (now - hintCool < 5000) { showToast('提示冷却中…'); return; }
      payAction('hint', function () {
        hintCool = performance.now();
        let n = 0;
        tapes.forEach(function (t) {
          if (t.state === 'live' && t.el) {
            t.el.classList.remove('glow');
            void t.el.offsetWidth;
            t.el.classList.add('glow');
            n++;
            setTimeout(function () { if (t.el) t.el.classList.remove('glow'); }, 2600);

      });
    });

    /* ========== 撕胶带：卷曲剥离 + ASMR 撕拉音 ========== */
    let tapeDrag = null;
    function showBlockedTape(t) {
      if (!t || !t.el) return;
      t.el.classList.remove('blockedPulse');
      void t.el.offsetWidth;
      t.el.classList.add('blockedPulse');
      setTimeout(function () { if (t.el) t.el.classList.remove('blockedPulse'); }, 360);
      haptic([7, 28, 7]);
      showToast('被上层胶带压住了，先撕最上面一条');
    }
    function startTapePeel(e, t, targetEl) {
      if (!running || wonFlag || loseFlag) return;
      if (t.state === 'blocked') {
        e.preventDefault(); e.stopPropagation();
        t.suppressClickUntil = performance.now() + 420;
        showBlockedTape(t);
        return;
      }
      if (t.state !== 'live') return;
      e.preventDefault(); e.stopPropagation();
      const el = targetEl || t.el;
      if (!el) return;
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* 全局监听仍可继续 */ }
      const pullDistance = 50 + Math.max(t.su, t.sv) * 34;
      tapeDrag = { t: t, el: el, id: e.pointerId, pointerType: e.pointerType || 'mouse', x: e.clientX, y: e.clientY, progress: 0, pullDistance: pullDistance };
      el.classList.add('peeling');
      el.classList.remove('snapback');
      window.addEventListener('pointermove', moveTapePeel, true);
      window.addEventListener('pointerup', endTapePeel, true);
      window.addEventListener('pointercancel', cancelTapePeel, true);
      haptic(8);
    }
    function moveTapePeel(e) {
      if (!tapeDrag || e.pointerId !== tapeDrag.id) return;
      e.preventDefault(); e.stopPropagation();
      const dx = e.clientX - tapeDrag.x, dy = e.clientY - tapeDrag.y;
      const dist = Math.hypot(dx, dy);
      const p = Math.min(1, Math.pow(dist / tapeDrag.pullDistance, .86));
      tapeDrag.progress = p;
      const t = tapeDrag.t, z = tapeDepth(t);
      const horiz = t.su >= t.sv;
      tapeDrag.el.style.transformOrigin = horiz ? (dx >= 0 ? 'left center' : 'right center') : (dy >= 0 ? 'center top' : 'center bottom');
      tapeDrag.el.style.transform = 'translateZ(' + (z + p * 34) + 'px)' + tapeAngleTransform(t) + ' translate3d(' + (dx * .52) + 'px,' + (dy * .52) + 'px,0) ' + (horiz ? 'rotateY(' + ((dx >= 0 ? 1 : -1) * p * 72) + 'deg)' : 'rotateX(' + ((dy >= 0 ? -1 : 1) * p * 72) + 'deg)');
      if (p > .35 && !tapeDrag.buzzed) { tapeDrag.buzzed = true; haptic(10); }
    }
    function clearTapeDrag() {
      if (!tapeDrag) return;
      const el = tapeDrag.el;
      window.removeEventListener('pointermove', moveTapePeel, true);
      window.removeEventListener('pointerup', endTapePeel, true);
      window.removeEventListener('pointercancel', cancelTapePeel, true);
      tapeDrag = null;
    }
    function endTapePeel(e) {
      if (!tapeDrag || e.pointerId !== tapeDrag.id) return;
      e.preventDefault(); e.stopPropagation();
      const d = tapeDrag, success = d.progress >= .6;
      const mouseClick = d.pointerType === 'mouse' && d.progress < .12;
      if (success || mouseClick) d.t.suppressClickUntil = performance.now() + 650;
      clearTapeDrag();
      if (success || mouseClick) onTapeClick(d.t, true);
      else snapTapeBack(d.t);
    }
    function cancelTapePeel(e) {
      if (!tapeDrag) return;
      const t = tapeDrag.t; clearTapeDrag(); snapTapeBack(t);
    }
    function snapTapeBack(t) {
      if (!t.el) return;
      const z = tapeDepth(t);
      t.el.classList.remove('peeling'); t.el.classList.add('snapback');
      t.el.style.transform = 'translateZ(' + z + 'px)' + tapeAngleTransform(t);
      setTimeout(function () { if (t.el) t.el.classList.remove('snapback'); }, 240);
    }
    function haptic(pattern) {
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* 忽略 */ }
    }
    function showRipImpact(t) {
      const now = performance.now();
      comboCount = now - lastRipAt < 1800 ? comboCount + 1 : 1;
      lastRipAt = now;
      const combo = document.getElementById('combo');
      document.getElementById('comboTxt').textContent = comboCount + ' COMBO';
      combo.classList.toggle('on', comboCount >= 2);
      clearTimeout(comboTimer);
      comboTimer = setTimeout(function () { combo.classList.remove('on'); comboCount = 0; }, 1900);
      const r = t.el ? t.el.getBoundingClientRect() : null;
      if (r) burstTapeScraps(r.left + r.width / 2, r.top + r.height / 2, t.color, Math.max(r.width, r.height));
      haptic(comboCount >= 4 ? [12, 18, 22] : [9, 12, 13]);
    }
    function onTapeClick(t, fromDrag) {
      if (!running || (!fromDrag && dragMoved) || wonFlag || loseFlag) return;
      if (t.state === 'blocked') { showBlockedTape(t); return; }
      if (t.state !== 'live') return;
      if (!canStoreColor(t.color)) {
        snapTapeBack(t);
        if (!checkDeadlock()) showToast('缓冲槽已满，先撕与回收槽同色的胶带');
        return;
      }
      t.state = 'tearing';
      if (t.el) { t.el.classList.remove('liveTape'); t.el.classList.add('ripping'); }
      showRipImpact(t);
      const horiz = t.su >= t.sv;
      const z = tapeDepth(t);
      if (horiz) {
        t.el.style.transformOrigin = t.sign > 0 ? 'left center' : 'right center';
        t.el.style.transform = 'translateZ(' + (z + 30) + 'px)' + tapeAngleTransform(t) + ' rotateY(' + (t.sign > 0 ? 80 : -80) + 'deg) translateX(' + (t.sign * 14) + '%)';
      } else {
        t.el.style.transformOrigin = t.sign > 0 ? 'center top' : 'center bottom';
        t.el.style.transform = 'translateZ(' + (z + 30) + 'px)' + tapeAngleTransform(t) + ' rotateX(' + (t.sign > 0 ? -80 : 80) + 'deg) translateY(' + (t.sign * 14) + '%)';
      }
      if (t.el.animate) {
        t.el.style.opacity = '1';
        t.el.animate([
          { transform: 'translateZ(' + z + 'px)' + tapeAngleTransform(t) + ' scale(1)' },
          { transform: 'translateZ(' + (z + 18) + 'px)' + tapeAngleTransform(t) + ' scale(1.04)', offset: .2 },
          { transform: horiz ? 'translateZ(' + (z + 42) + 'px)' + tapeAngleTransform(t) + ' rotateY(' + (t.sign * 96) + 'deg) translateX(' + (t.sign * 28) + '%) scaleX(.72)' : 'translateZ(' + (z + 42) + 'px)' + tapeAngleTransform(t) + ' rotateX(' + (-t.sign * 96) + 'deg) translateY(' + (t.sign * 28) + '%) scaleY(.72)', opacity: 0 }
        ], { duration: 520, easing: 'cubic-bezier(.18,.72,.16,1)', fill: 'forwards' });
      } else {
        t.el.style.opacity = '0';
      }
      tearSound(Math.max(t.su, t.sv));
      setTimeout(function () { finalizeTorn(t); }, 520);
    }

    function tapeAxes(t) {
      const a = (t.angle || 0) * Math.PI / 180;
      return {
        x: { x: Math.cos(a), y: Math.sin(a) },
        y: { x: -Math.sin(a), y: Math.cos(a) },
      };
    }
    function axisDot(a, b) { return a.x * b.x + a.y * b.y; }
    function tapesOverlap(a, b) {
      if (a.face !== b.face) return false;
      const aa = tapeAxes(a), ba = tapeAxes(b);
      const delta = { x: b.u - a.u, y: b.v - a.v };
      const axes = [aa.x, aa.y, ba.x, ba.y];
      for (let i = 0; i < axes.length; i++) {
        const axis = axes[i];
        const distance = Math.abs(axisDot(delta, axis));
        const ar = a.su / 2 * Math.abs(axisDot(aa.x, axis)) + a.sv / 2 * Math.abs(axisDot(aa.y, axis));
        const br = b.su / 2 * Math.abs(axisDot(ba.x, axis)) + b.sv / 2 * Math.abs(axisDot(ba.y, axis));
        if (distance >= ar + br - .018) return false;
      }
      return true;
    }

    function refreshModuleTapeStates(mi, animate) {
      const remaining = tapes.filter(function (x) {
        return x.mi === mi && x.state !== 'torn' && x.state !== 'tearing';
      });
      let unlocked = 0;
      remaining.forEach(function (x) {
        const was = x.state;
        const covered = remaining.some(function (above) {
          return above !== x && (above.zOrder || 0) > (x.zOrder || 0) && tapesOverlap(x, above);
        });
        x.state = covered ? 'blocked' : 'live';
        if (x.el) {
          x.el.classList.remove('hiddenL');
          x.el.classList.toggle('blockedTape', covered);
          x.el.classList.toggle('liveTape', !covered);
          x.el.dataset.stack = covered ? '2' : '1';
          if (animate && x.state === 'live' && was !== 'live') {
            unlocked++;
            x.el.classList.remove('pop');
            void x.el.offsetWidth;
            x.el.classList.add('pop');
          }
        }
      });
      return unlocked;
    }

    function advanceModuleLayers(mi) {
      const m = modules[mi];
      if (!m) return;
      const unlocked = refreshModuleTapeStates(mi, true);
      if (unlocked > 0) {
        beep(610, .1, .07);
        showToast('交叉点松开，' + unlocked + ' 条胶带可以撕了');
      }
    }

    function finalizeTorn(t) {
      if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el);
      t.state = 'torn';
      tornCount++;
      updateCounter();
      renderQuests();
      const ok = placeColor(t.color);
      if (!ok) { doLose(); return; }
      const m = modules[t.mi];
      advanceModuleLayers(t.mi);
      const modLeft = tapes.some(function (x) { return x.mi === t.mi && x.state !== 'torn'; });
      if (!modLeft && !m.falling) {
        m.falling = true;
        beep(180, 0.22, 0.12);
        if (m.boxEl) {
          m.boxEl.classList.add('falling');
          m.boxEl.style.transform = m.restTransform + ' translate3d(0, 62vh, -80px) rotateX(34deg) rotateZ(12deg)';
        }

            modules.forEach(function (part) { if (part.boxEl) part.boxEl.style.display = 'none'; });
            gift.style.display = 'block';

            gift.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.4, 0.44, 1)';
            setTimeout(function () { gift.style.transform = 'scale3d(1, 1, 1)'; }, 30);
            burstConfetti(window.innerWidth / 2, window.innerHeight * 0.5);
            beep(660, 0.3, 0.14);
            setTimeout(function () { beep(880, 0.35, 0.12); }, 160);
            spinBaseYaw = yaw;
            spinT0 = performance.now();
          }, 420);
          setTimeout(showWin, 2300);
        } else {
          showToast('拆掉一个部件！继续寻找翘起的胶带头');
        }
      }
      setTimeout(checkDeadlock, 80);
    }

    function doLose() {
      if (loseFlag || wonFlag) return;
      loseFlag = true;
      running = false;
      beep(120, 0.4, 0.14);
      const timeSec = Math.max(1, Math.round((nowTs() - startTs) / 1000));
      document.getElementById('loseStats').innerHTML =
        '缓冲槽已满，当前外层也没有与回收槽同色的胶带。<br>本局撕下 ' + tornCount + '/' + totalTapes + ' 条 · 回收 ' + rolls + ' 卷';

    }

    function showWin() {
      if (wonFlag) return;

    /* ========== 特效画布 ========== */
    const fx = document.getElementById('fx');
    const fctx = fx.getContext('2d');
    let FW = 0, FH = 0;
    function fxResize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      FW = window.innerWidth; FH = window.innerHeight;
      fx.width = Math.round(FW * dpr); fx.height = Math.round(FH * dpr);

      applyPivot(false);

    const flakes = [];
    for (let i = 0; i < 40; i++) {
      flakes.push({ x: Math.random(), y: Math.random(), s: 0.4 + Math.random() * 0.8, r: 1 + Math.random() * 2.2, ph: Math.random() * 6.28 });
    }
    let confetti = [], tapeScraps = [];
    function burstTapeScraps(sx, sy, color, span) {
      const count = Math.max(8, Math.min(22, Math.round(span / 8)));
      for (let i = 0; i < count; i++) {
        const a = -Math.PI * .88 + Math.random() * Math.PI * .76;
        const sp = 2.4 + Math.random() * 5.8;
        tapeScraps.push({
          x: sx + (Math.random() - .5) * 14, y: sy + (Math.random() - .5) * 8,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          rot: Math.random() * 6.28, vr: (Math.random() - .5) * .48,
          c: COL[color] || '#fff', life: 1, w: 3 + Math.random() * 8,
        });
      }
    }
    function burstConfetti(sx, sy) {
      confetti = [];
      const cols = [COL.red, COL.green, COL.yellow, COL.blue, COL.purple, '#ffffff'];
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 6;
        confetti.push({
          x: sx, y: sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
          c: cols[i % cols.length], life: 1, w: 4 + Math.random() * 5,
        });
      }
    }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function fxFrame(now) {
      // 阻尼惯性
      if (inertiaOn) {
        yaw += velYaw;
        velYaw *= 0.93;
        if (Math.abs(velYaw) < 0.02) { inertiaOn = false; velYaw = 0; }
        applyPivot(false);
      }
      // 通关 360° 展示
      if (spinT0) {
        const t = (now - spinT0) / 1500;
        if (t < 1) {
          yaw = spinBaseYaw + 360 * easeInOut(t);
          applyPivot(false);
        } else {
          spinT0 = 0;
        }
      }
      fctx.clearRect(0, 0, FW, FH);
      fctx.fillStyle = 'rgba(255,255,255,0.85)';
      flakes.forEach(function (f) {
        f.y += f.s * 0.0016;
        f.x += Math.sin(now / 900 + f.ph) * 0.0004;
        if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
        fctx.beginPath();
        fctx.arc(f.x * FW, f.y * FH, f.r, 0, Math.PI * 2);
        fctx.fill();
      });
      if (confetti.length) {
        confetti = confetti.filter(function (c) { return c.life > 0; });
        confetti.forEach(function (c) {
          c.x += c.vx; c.y += c.vy; c.vy += 0.18; c.rot += c.vr; c.life -= 0.008;
          fctx.save();
          fctx.translate(c.x, c.y);
          fctx.rotate(c.rot);
          fctx.globalAlpha = Math.max(0, c.life);
          fctx.fillStyle = c.c;
          fctx.fillRect(-c.w / 2, -c.w / 4, c.w, c.w / 2);
          fctx.restore();
          fctx.globalAlpha = 1;
        });
      }
      if (tapeScraps.length) {
        tapeScraps = tapeScraps.filter(function (c) { return c.life > 0; });
        tapeScraps.forEach(function (c) {
          c.x += c.vx; c.y += c.vy; c.vy += .24; c.vx *= .985; c.rot += c.vr; c.life -= .024;
          fctx.save(); fctx.translate(c.x, c.y); fctx.rotate(c.rot);
          fctx.globalAlpha = Math.max(0, c.life); fctx.fillStyle = c.c;
          fctx.fillRect(-c.w / 2, -1.5, c.w, 3);
          fctx.fillStyle = 'rgba(255,255,255,.45)'; fctx.fillRect(-c.w / 2, -1.5, c.w, .7);

    requestAnimationFrame(fxFrame);

    /* ========== 音效 ========== */
    let AC = null;
    function audioCtx() {
      if (!AC) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        AC = new Ctor();
      }
      if (AC.state === 'suspended') AC.resume();
      return AC;
    }
    function beep(freq, dur, vol) {
      try {
        const ac = audioCtx();
        if (!ac) return;
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle';
        o.frequency.value = freq;
        g.gain.setValueAtTime(vol, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        o.connect(g); g.connect(ac.destination);
        o.start(); o.stop(ac.currentTime + dur + 0.02);
      } catch (e) { /* 忽略 */ }
    }
    /* ASMR 撕拉噪声：长度随胶带尺寸变化 */
    function tearSound(lenFrac) {
      try {
        const ac = audioCtx();
        if (!ac) return;
        const dur = 0.09 + 0.26 * Math.min(1, lenFrac);
        const n = Math.floor(ac.sampleRate * dur);
        const buf = ac.createBuffer(1, n, ac.sampleRate);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < n; i++) {
          const env = 1 - i / n;
          ch[i] = (Math.random() * 2 - 1) * env * env;
        }
        const src = ac.createBufferSource();
        src.buffer = buf;
        const bp = ac.createBiquadFilter();
        bp.type = 'bandpass';
        bp.Q.value = 0.8;
        bp.frequency.setValueAtTime(2400, ac.currentTime);
        bp.frequency.exponentialRampToValueAtTime(500, ac.currentTime + dur);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.32, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        src.connect(bp); bp.connect(g); g.connect(ac.destination);
        src.start();
        /* 起撕“啪” + 尾端粘连脆响，增强触觉联想。 */
        [0, dur * .72].forEach(function (delay, idx) {
          const click = ac.createOscillator(), cg = ac.createGain();
          click.type = idx ? 'square' : 'triangle';
          click.frequency.setValueAtTime(idx ? 1320 : 420, ac.currentTime + delay);
          click.frequency.exponentialRampToValueAtTime(idx ? 620 : 180, ac.currentTime + delay + .045);
          cg.gain.setValueAtTime(idx ? .035 : .07, ac.currentTime + delay);
          cg.gain.exponentialRampToValueAtTime(.001, ac.currentTime + delay + .055);
          click.connect(cg); cg.connect(ac.destination);
          click.start(ac.currentTime + delay); click.stop(ac.currentTime + delay + .06);
        });
      } catch (e) { /* 忽略 */ }
    }

    /* ========== 开局 ========== */
    const startOv = document.getElementById('startOv');
    const winOv = document.getElementById('winOv');
    const loseOv = document.getElementById('loseOv');
    document.getElementById('costLine').textContent = '原型试玩版 · 能量数值待定 · 扩容仅本局有效';
    function updateStartOv() {
      document.getElementById('levelLine').textContent =
        '当前进度：第 ' + curLevel + ' 关 / 共 ' + LEVELS.length + ' 关（' + LEVELS[curLevel - 1].name + '）';
    }
    updateStartOv();

    function doStartGame() {
      startedOnce = true;
      buildLevel();
      confetti = [];
      running = true;
      startTs = nowTs();
      state.plays++;
      startOv.classList.add('hidden');
      winOv.classList.add('hidden');
      loseOv.classList.add('hidden');
    }
    document.getElementById('startBtn').addEventListener('click', function () { payAction('start', doStartGame); });
    document.getElementById('againBtn').addEventListener('click', function () {

    document.getElementById('retryBtn').addEventListener('click', function () { payAction('start', doStartGame); });
    document.getElementById('reviveBtn').addEventListener('click', function () {
      if (!loseFlag || wonFlag) return;
      payAction('revive', function () {
        buffer = [];
        const added = unlockNextBin(false);
        reviveUsed = true;
        loseFlag = false;
        running = true;
        renderBins(); renderBuffer();
        loseOv.classList.add('hidden');
        showToast(added ? '复活成功：清空缓冲槽，并新增 1 个回收槽' : '复活成功：缓冲槽已清空');
      });
    });

    /* ========== 初始化 ========== */
    buildLevel();
    running = false;
    if (PREVIEW_QUERY.get('autostart') === '1' || IS_LOCAL_FILE) doStartGame();
  </script>
</body>

</html>
